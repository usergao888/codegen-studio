# 本地开发用 Redis 配置（Windows 免安装版 D:\Redis-x64-3.0.504）
#
# 用法：
#   D:\Redis-x64-3.0.504\redis-server.exe F:\dsh_space\codegen-studio\scripts\redis.conf
#
# 两个关键点，都是实际踩出来的：
# 1. dir 指向工作区。默认会往安装目录写 dump.rdb，而那个目录常常不可写，
#    bgsave 失败后 Redis 进入 MISCONF 状态，**所有写命令都会被拒绝**，
#    表现是缓存和限流全部静默失效。
# 2. save "" 关掉快照。演示环境不需要持久化，关掉就不会有 bgsave 失败这回事。

port 6379
bind 127.0.0.1

dir F:\dsh_space\codegen-studio\var\redis

save ""
appendonly no
stop-writes-on-bgsave-error no

dbfilename dump.rdb
