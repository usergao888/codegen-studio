server:
  port: 18080
  # 显式声明响应编码：JSON 规范默认 UTF-8，但 PowerShell 5.1 这类客户端
  # 不看规范只看 Content-Type，缺 charset 就会把中文解成乱码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: codegen-studio
  mvc:
    async:
      request-timeout: 120000

studio:
  # 生成产物落盘目录（预览站点从这里提供）
  workspace: ./var/sites
  # 同一需求缓存多久（秒）
  cache-ttl-seconds: 1800
  cache-max-entries: 256
  # true 时质检通过也不直接发布，先暂存等人确认（HITL）
  require-approval: false
  # 质检失败后最多重生成几次
  max-repair-rounds: 2
  # 令牌桶：每个用户每秒补充多少个令牌、桶容量
  rate-limit:
    permits-per-second: 5
    burst: 10
    # 三级限流：任一级超限即拒绝；不写 levels 则按上面两个值自动派生
    levels:
      user:
        permits-per-second: 5
        burst: 10
      ip:
        permits-per-second: 20
        burst: 40
      endpoint:
        permits-per-second: 50
        burst: 100
  # 多模型路由的档位（离线时用 deterministic 桩）
  models:
    small: deepseek-chat
    strong: deepseek-reasoner
    complex-prompt-chars: 120
  # 二级缓存后端：true 时连 Redis 做跨进程共享；连不上会自动回退到进程内实现
  redis:
    enabled: true
    host: 127.0.0.1
    port: 6379
    database: 0
    key-prefix: "studio:gen:"

# 暴露 Prometheus 抓取端点：/actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: codegen-studio
